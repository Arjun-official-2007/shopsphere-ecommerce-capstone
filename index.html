<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopSphere | E-Commerce Storefront</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="topbar">
      <h1>ShopSphere</h1>
      <nav class="nav">
        <button class="btn ghost" data-view="catalog">Shop</button>
        <button class="btn ghost" data-view="cart">Cart (<span id="cartCount">0</span>)</button>
        <button class="btn ghost hidden" id="adminTab" data-view="admin">Admin</button>
        <span class="muted" id="userLabel"></span>
        <button class="btn" id="authBtn">Login</button>
      </nav>
    </header>

    <div id="errorBox"></div>

    <section id="catalogView">
      <div class="controls">
        <input id="search" type="search" placeholder="Search products...">
        <select id="sort">
          <option value="default">Sort: Default</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="products" id="products"></div>
    </section>

    <section id="cartView" class="hidden"></section>

    <section id="adminView" class="hidden">
      <div class="topbar"><h2>Manage Products</h2><button class="btn" id="addProductBtn">+ Add Product</button></div>
      <div class="card table-wrap"><table><thead><tr><th>Title</th><th>Category</th><th>Price</th><th>Actions</th></tr></thead><tbody id="adminRows"></tbody></table></div>
    </section>
  </main>

  <dialog id="authDialog">
    <form method="dialog" id="authForm">
      <h2 id="authTitle">Login</h2>
      <label>Name <input id="aName" class="hidden-when-login" placeholder="Your name"></label>
      <label>Email <input id="aEmail" type="email" required></label>
      <label>Password <input id="aPass" type="password" minlength="6" required></label>
      <p class="muted" id="authMsg"></p>
      <div class="row"><button class="btn" type="submit">Continue</button><button class="btn ghost" type="button" id="switchAuth">Need an account? Register</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
      <p class="muted">Demo admin: admin@shopsphere.dev / admin123</p>
    </form>
  </dialog>

  <dialog id="productDialog">
    <form id="productForm">
      <h2 id="productTitle">Add Product</h2>
      <label>Title <input id="pTitle" required></label>
      <label>Price <input id="pPrice" type="number" step="0.01" min="0" required></label>
      <label>Category <input id="pCategory" required></label>
      <label>Image URL <input id="pImage" type="url" placeholder="https://..."></label>
      <div class="row"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
